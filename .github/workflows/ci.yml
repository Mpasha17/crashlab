name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev, no provider SDKs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test without provider SDKs
        run: python -m pytest
      - name: Install provider extras
        run: python -m pip install -e ".[dev,openai,anthropic,litellm]"
      - name: Test with openai, anthropic and litellm installed
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: python -m pytest
      - name: CLI smoke test
        run: crashlab --version
