[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crashlab"
dynamic = ["version"]
description = "Crash-test your AI agents: record, replay, diagnose and verify agent failures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mahaboob Pasha" }]
keywords = ["ai", "agents", "llm", "debugging", "testing", "replay", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.30"]
litellm = ["litellm>=1.40"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
crashlab = "crashlab.cli:app"

[project.urls]
Homepage = "https://github.com/Mpasha17/crashlab"
Repository = "https://github.com/Mpasha17/crashlab"
Issues = "https://github.com/Mpasha17/crashlab/issues"

[tool.hatch.version]
path = "src/crashlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crashlab"]

[tool.hatch.build.targets.sdist]
include = ["src/crashlab", "tests", "examples", "README.md", "ARCHITECTURE.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
