[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crashlab"
dynamic = ["version"]
description = "Crash-test your AI agents: record, replay, diagnose and verify agent failures."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mahaboob Pasha" }]
keywords = [
    "ai", "agents", "ai-agents", "llm", "debugging", "testing", "pytest", "replay",
    "observability", "agent-evaluation", "openai", "anthropic", "litellm",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "tomli>=1.1; python_version < '3.11'",  # [tool.crashlab] in pyproject.toml
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.30"]
# mcp: litellm 1.106 imports it whenever tools= is passed but only lists it in its
# proxy/mcp extras (ModuleNotFoundError: mcp otherwise)
litellm = ["litellm>=1.40", "mcp>=1.0"]
yaml = ["pyyaml>=6"]  # YAML patch files for `crashlab fork --patch fix.yaml`
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff>=0.6",
]

[project.scripts]
crashlab = "crashlab.cli:run"

[project.entry-points.pytest11]
crashlab = "crashlab.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Mpasha17/crashlab"
Repository = "https://github.com/Mpasha17/crashlab"
Issues = "https://github.com/Mpasha17/crashlab/issues"
Changelog = "https://github.com/Mpasha17/crashlab/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/crashlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crashlab"]

[tool.hatch.build.targets.sdist]
include = [
  "src/crashlab",
  "tests",
  "examples",
  "docs",
  "scripts",
  "README.md",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "LICENSE",
]
# internal launch drafts, live stores and anything key-shaped never ship
exclude = [
  "docs/launch",
  "**/.crashlab",
  "**/crashlab-live",
  "**/real-agents",
  "**/.env",
  "**/*.env",
  "**/.secrets",
  "**/__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# nested `with record(...)` blocks read better in tests than one combined statement
"tests/**" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/refund_bot/tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    # noise from litellm's own pydantic models
    "ignore:.*ReadOnly.*:UserWarning",
]
